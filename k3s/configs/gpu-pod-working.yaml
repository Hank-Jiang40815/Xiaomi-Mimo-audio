apiVersion: v1
kind: Pod
metadata:
  name: gpu-pod-working
  namespace: default
spec:
  restartPolicy: OnFailure
  containers:
  - name: gpu-container
    image: nvidia/cuda:12.2.0-base-ubuntu22.04
    command:
      - /bin/bash
      - -c
      - |
        echo "=== GPU Pod 運行中 ==="
        nvidia-smi
        echo "=== 保持運行 ==="
        while true; do sleep 30; done
    resources:
      limits:
        nvidia.com/gpu: 1
      requests:
        nvidia.com/gpu: 1
